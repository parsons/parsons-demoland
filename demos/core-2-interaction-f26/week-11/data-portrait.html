<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>A data portrait of your week</title>
	<style>
		body {
			padding: 40px;
			font-family: Helvetica, Arial, sans-serif;
		}
		#output {
			font-size: 17px;
			white-space: pre-wrap;
		}
	</style>
</head>
<body>

	<h1>My week, as data</h1>
	<pre id="output"></pre>

	<script>
		var myWeek = {
			subject: "What I ate this week"
		};

		// Prints your object on the page
		document.querySelector("#output").textContent = JSON.stringify(myWeek, null, 2);
	</script>

</body>
</html>
