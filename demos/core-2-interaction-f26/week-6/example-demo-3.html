<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Position property</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			height: 200vh;
		}

		.large {
			background-color: rgb(252, 136, 165);
			width: 400px;
			height: 500px;
			/* position: fixed; */
		}

		.medium {
			width: 250px;
			height: 400px;
			background-color: rgb(163, 107, 182);
			/* 	position: absolute;
			top: 0;
			left: 0; */
		}

		.small {
			width: 150px;
			height: 300px;
			background-color: rgb(0, 155, 0);
			padding: 10px;
		}
		.window {
			width: 60px;
			height: 280px;
			background-color: greenyellow;
			display: inline-block;
		}
		.window:nth-of-type(1) {
			margin-right: 6px;
		}
		.connector {
			width: 50px;
			height: 300px;
			background-color: brown;
		}
		.connector__corner {
			width: 100px;
			height: 50px;
			background-color: brown;
		}
	</style>
</head>

<body>
	<div class="large"></div>
	<div class="medium"></div>
	<div class="small">
		<div class="window"></div>
		<div class="window"></div>
	</div>
	<div class="connector">
		<div class="connector__corner"
	</div>
</body>

</html>
