<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS box model</title>
	<style>
		body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}
		.container {
			width: 500px;
			height: 300px;
			border: 10px solid darkseagreen;
			/* padding: 40px;
			box-sizing: border-box; */
		}
		.box {
			width: 400px;
			height: 200px;
			background-color: plum;
			/* margin: 50px; */
		}
	</style>
</head>

<body>
	<section class="container">
		<div class="box"></div>
	</section>
</body>

</html>
