<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline display</title>

	<style>
		body {
			font-size: 32px;
		}

		span {
			border: solid 4px dodgerblue;
			line-height: 1.5;
			/* width: 100px;
			height: 100px; */
		}

		p {
			border: dotted 4px green;
			/* p is a block element, but we can overwrite it by specifying a new display value */
			/* display: inline-block; */
			/* width: 150px; */
			/* vertical-align: top; */
		}
	</style>

</head>

<body>
	<!-- Exerpt from Helen Mirra, Escritura-a-través -->
	<span>Barely raining on woodland trail</span>
	<span>Along dry riverbed, leaves rustling, falling</span>
	<span>Fuzzy monkeys on road, some young down below</span>
	<p>Ichi o mata valley</p>
	<p>Down river into the warming
		sun</p>
	<p>Tender feet, sparkling woods, sleepy mood</p>
	<p>Shrew-mole scurrying in orange
		leaves</p>
</body>

</html>
